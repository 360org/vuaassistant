[package]
name = "vuaassistant"
version = "1.1.71"
description = "VuaAssistant — AI for everyone"
authors = ["360org <support@vuaai.net>"]
homepage = "https://vuaai.net"
edition = "2021"

[lib]
name = "vuaassistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# VuaAssistant-owned encrypted SQLite Vault.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
rfd = "0.15"
base64 = "0.22"
# Computer Use: mouse/keyboard simulation and screen capture.
# enigo: cross-platform input simulation (macOS/Windows/Linux).
# screenshots: lightweight screen capture, no ffmpeg dependency.
enigo = "0.2"
screenshots = "0.8"
# Optional WASM sandbox for running agent code safely, off by default so the
# shipped app stays lightweight and starts instantly. Enable with
# `--features sandbox` for builds that run untrusted agent code.
wasmtime = { version = "46.0.1", optional = true }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-global-shortcut = "2.3.2"

[features]
sandbox = ["dep:wasmtime"]

# The sandbox example only builds when the feature is on.
[[example]]
name = "sandbox_check"
required-features = ["sandbox"]
